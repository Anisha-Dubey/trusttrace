[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trusttrace"
version = "0.1.0"
description = "TrustTrace Threat Intelligence and Evidence Engine"
readme = "README.md"
requires-python = ">=3.10"

[tool.pyright]
extraPaths = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
