[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trusttrace"
version = "0.1.0"
description = "TrustTrace Threat Intelligence and Evidence Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
    "jsonschema>=4.18.0",
    "redis>=5.0.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
test = [
    "fakeredis>=2.20.0",
    "psycopg2-binary>=2.9.9",
]

[tool.pyright]
extraPaths = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
